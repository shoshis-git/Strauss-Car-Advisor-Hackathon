# Render Blueprint - backend (FastAPI). Frontend -> Vercel, conversations DB -> Supabase.
# Secrets (sync: false) are entered once in the Render dashboard, never committed.
services:
  - type: web
    name: strauss-car-advisor-api
    runtime: python
    plan: free
    # builds the Tax Authority table at build time (saves ~8s on every cold start)
    buildCommand: pip install -r requirements.txt && python -m backend.data_loader.build_data
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: API_DOCS
        value: "0"
      # Supabase -> Connect -> Transaction pooler (port 6543; Render has no IPv6 for the direct URL)
      - key: DATABASE_URL
        sync: false
      # the Vercel address, e.g. https://strauss-car-advisor.vercel.app (comma-separated)
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_FALLBACK
        value: none
      - key: REP_API_KEY
        generateValue: true
